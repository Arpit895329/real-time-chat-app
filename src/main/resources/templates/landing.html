<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <style>
      .dots::after {
        content: "";
        animation: dots 1.5s steps(3, end) infinite;
      }

      @keyframes dots {
        0% {
          content: "";
        }
        33% {
          content: ".";
        }
        66% {
          content: "..";
        }
        100% {
          content: "...";
        }
      }
    </style>
    <title>Join Chat</title>
    <link rel="icon" href="images/ab.png" type="image/png" />
    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/site.css}" />
  </head>

  <body class="bg-dark vh-100">
    <div
      class="container-fluid h-100 d-flex justify-content-center align-items-center"
    >
      <div class="row justify-content-center g-3 ">
        <div class="col-12 col-md-6 d-flex justify-content-center">
          <!-- Left section: Join Chat Form -->
          <div
            class="card p-4 shadow-lg text-center"
            style="width: 350px; border-radius: 15px"
          >
            <h3 class="mb-3">💬 Join Global Chat</h3>
            <form action="/chat" method="get">
              <input
                type="text"
                name="username"
                class="form-control mb-3"
                placeholder="Enter your name"
                required
              />
              <button type="submit" class="btn btn-primary w-100">
                Enter Chat
              </button>
            </form>
          </div>
        </div>
        <div class="col-12 col-md-6 d-flex justify-content-center">
          <!-- Right section: Placeholder for Chat Rooms -->
          <div
            class="card p-4 shadow-lg text-center"
            style="width: 350px; border-radius: 15px"
          >
            <h3 class="mb-3">Chat Rooms</h3>
            <button
              type="button"
              class="btn btn-primary w-100"
              th:onclick="|window.location.href='@{/join}'|"
            >
              Join Existing Room
            </button>
            <br>

            <button
              type="button"
              class="btn btn-primary w-100"
              th:onclick="|window.location.href='@{/create}'|"
            >
              Create Room
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
