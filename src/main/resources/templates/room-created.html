<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Created</title>
    <link rel="icon" href="images/ab.png" type="image/png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="bg-dark vh-100">
    <div class="container-fluid h-100 d-flex justify-content-center align-items-center">
        <div class="row justify-content-center">
            <div class="col-auto">
                <div class="card p-4 shadow-lg text-center" style="width: 450px; border-radius: 15px">
                    <h3 class="mb-4">✅ Room Created Successfully!</h3>
                    
                    <div class="alert alert-info" role="alert">
                        <div class="mb-3">
                            <strong>Room Name:</strong>
                            <p class="h5" th:text="${roomName}"></p>
                        </div>
                        <div>
                            <strong>Room ID:</strong>
                            <p class="h5 text-monospace" th:text="${roomId}"></p>
                        </div>
                    </div>
                    
                    <p class="text-muted mb-4">Share this Room ID with others so they can join</p>
                    
                    <form action="/chat" method="get">
                        <input type="hidden" name="username" th:value="${username}" />
                        <input type="hidden" name="roomId" th:value="${roomId}" />
                        <button type="submit" class="btn btn-primary w-100 mb-2">Enter Room</button>
                    </form>
                    
                    <button type="button" class="btn btn-secondary w-100" onclick="window.location.href='/'">
                        Back to Home
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
