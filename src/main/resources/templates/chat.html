<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Room</title>
    <link rel="icon" href="images/ab.png" type="image/png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .message-row {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #dee2e6;
      }
      .message-row:last-child {
        border-bottom: none;
      }
      .chat-box {
        min-height: 320px;
        max-height: 360px;
        overflow-y: auto;
      }
    </style>
  </head>

  <body class="bg-dark vh-100">
    <div class="container-fluid h-100 d-flex justify-content-center align-items-center">
      <div class="row justify-content-center g-3 w-100">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-lg" style="border-radius: 18px;">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                  <h3 class="mb-1">💬 Chat Room</h3>
                  <p class="text-muted mb-0">
                    Connected as <strong th:text="${username}"></strong>
                  </p>
                </div>
                <button
                  type="button"
                  class="btn btn-outline-secondary btn-sm"
                  th:onclick="|window.location.href='@{/' }|"
                >
                  Home
                </button>
              </div>

              <div id="chat" class="border rounded chat-box mb-3 p-3 bg-light"></div>

              <div class="input-group">
                <input
                  type="text"
                  id="messageInput"
                  class="form-control"
                  placeholder="Type your message..."
                />
                <button id="sendMessage" class="btn btn-primary">Send</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.1/stomp.min.js"></script>
    <script>
      let username = "[[${username}]]";
      var stompClient = null;

      function setConnected(connected) {
        document.getElementById("sendMessage").disabled = !connected;
      }

      function connect() {
        const socket = new SockJS("/chat");
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
          setConnected(true);
          stompClient.subscribe("/topic/messages", function (message) {
            showMessage(JSON.parse(message.body));
          });
        });
      }

      function showMessage(message) {
        const chat = document.getElementById("chat");
        const messageElement = document.createElement("div");
        messageElement.className = "message-row";
        messageElement.textContent = `${message.sender}: ${message.content}`;
        chat.appendChild(messageElement);
        chat.scrollTop = chat.scrollHeight;
      }

      function sendMessage() {
        const content = document.getElementById("messageInput").value;
        if (!content.trim()) {
          return;
        }
        const chatMessage = {
          sender: username,
          content: content,
        };
        stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
        document.getElementById("messageInput").value = "";
      }

      document.getElementById("sendMessage").onclick = sendMessage;
      window.onload = connect;
    </script>
  </body>
</html>
