<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
    .custom-checkbox {
    border: 1px solid black !important;
    background-color: white;
    }
    
</style>
    <title>Create Room</title>
    <link rel="icon" href="images/ab.png" type="image/png" />
    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
        <link rel="stylesheet" th:href="@{/css/site.css}" />
</head>
<body class="bg-dark vh-100">
    <div class="container-fluid h-100 d-flex justify-content-center align-items-center">
        <div class="row justify-content-center">
            <div class="col-auto">
                <div class="card p-4 shadow-lg text-center" style="width: 400px; border-radius: 15px">
                    <h3 class="mb-3">🏠 Create Chat Room</h3>
                    <form action="/create-room" method="post">
                        <div class="mb-3">
                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter your name"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <input
                                type="text"
                                name="roomName"
                                class="form-control"
                                placeholder="Enter room name"
                                required
                            />
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input custom-checkbox" id="locked" name="locked">
                            <label class="form-check-label text-black" for="locked">Lock room with password</label>
                        </div>
                        <div class="mb-3" id="passwordField" style="display: none;">
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                            />
                        </div>
                        <button type="submit" class="btn btn-primary w-100" >
                            Create Room
                        </button>
                    </form>
                    <br>
                    <button
                        type="button"
                        class="btn btn-secondary w-100"
                        onclick="window.location.href='/'"
                    >
                        Back to Home
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('locked').addEventListener('change', function() {
            var passwordField = document.getElementById('passwordField');
            if (this.checked) {
                passwordField.style.display = 'block';
            } else {
                passwordField.style.display = 'none';
            }
        });
    </script>
</body>
</html>
